[app]
name = "Hàn Quân"
native_language = "vie"
target_language = "kor"

[llm]
provider = "gemini"
api_key  = ""
# Bậc thang model: app dùng model đầu tiên, khi model đó hết hạn mức (lỗi 429)
# hoặc quá tải thì TỰ ĐỘNG chuyển xuống model kế tiếp. Dán đúng ID model bạn có
# trong trang giới hạn của Google AI Studio, xếp từ ưu tiên cao xuống thấp.
models   = ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-1.5-flash"]

[whisper]
model = "small"

# Proxy để lấy phụ đề / tải audio từ YouTube khi deploy lên máy chủ cloud.
# YouTube CHẶN IP trung tâm dữ liệu, nên trên cloud cần proxy DÂN CƯ (residential)
# thì việc "người dùng dán link YouTube bất kỳ" mới chạy được. Để TRỐNG khi chạy ở
# máy nhà (IP nhà không bị chặn). Ví dụ: "http://user:pass@host:port".
[network]
proxy = ""

# Tài khoản quản trị (đăng nhập trang Admin để quản lý nội dung & người dùng).
# Để password TRỐNG: lần khởi động đầu hệ thống tự sinh mật khẩu ngẫu nhiên
# và in ra console đúng 1 lần — hãy lưu lại rồi đổi trong trang Admin.
[admin]
email    = "admin@vyling.vn"
password = ""
name     = "Quản trị viên"

# Đăng nhập Google / Facebook (tùy chọn). Để trống thì 2 nút đó sẽ ẩn.
#   Google : tạo OAuth Client ID (Web) tại https://console.cloud.google.com/apis/credentials
#            thêm Authorized redirect URI: http://127.0.0.1:8000/api/auth/google/callback
#   Facebook: tạo app tại https://developers.facebook.com → Facebook Login
#            Valid OAuth Redirect URI: http://127.0.0.1:8000/api/auth/facebook/callback
[oauth]
google_client_id     = ""
google_client_secret = ""
facebook_app_id      = ""
facebook_app_secret  = ""
