[app]
name = "Hàn Quân"
native_language = "vie"
target_language = "kor"

[llm]
provider = "gemini"
api_key  = ""
# Bậc thang model: app dùng model đầu tiên, khi model đó hết hạn mức (lỗi 429)
# hoặc quá tải thì TỰ ĐỘNG chuyển xuống model kế tiếp. Dán đúng ID model bạn có
# trong trang giới hạn của Google AI Studio, xếp từ ưu tiên cao xuống thấp.
models   = ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-1.5-flash"]

[anki]
url       = "http://127.0.0.1:8765"
deck      = "TiengHan"
note_type = "HanQuan"

[whisper]
model = "small"
