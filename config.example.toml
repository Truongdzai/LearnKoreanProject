[app]
name = "Hàn Quân"
native_language = "vie"
target_language = "kor"
# Tên miền thật khi chạy public — dùng cho sitemap.xml và robots.txt.
# Để trống thì hệ thống tự lấy theo domain của request.
public_url = ""

[llm]
provider = "gemini"
api_key  = ""
# Bậc thang model: app dùng model đầu tiên, khi model đó hết hạn mức (lỗi 429)
# hoặc quá tải thì TỰ ĐỘNG chuyển xuống model kế tiếp. Dán đúng ID model bạn có
# trong trang giới hạn của Google AI Studio, xếp từ ưu tiên cao xuống thấp.
models   = ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-1.5-flash"]

[whisper]
model = "small"

# Proxy để lấy phụ đề / tải audio từ YouTube khi deploy lên máy chủ cloud.
# YouTube CHẶN IP trung tâm dữ liệu, nên trên cloud cần proxy DÂN CƯ (residential)
# thì việc "người dùng dán link YouTube bất kỳ" mới chạy được. Để TRỐNG khi chạy ở
# máy nhà (IP nhà không bị chặn). Ví dụ: "http://user:pass@host:port".
[network]
proxy = ""

# Bảo mật khi chạy thật (production).
#   expose_docs : bật/tắt trang tài liệu API tự sinh (/docs, /redoc, /openapi.json).
#                 Để true khi phát triển ở máy nhà; ĐẶT false khi lên máy chủ công khai
#                 để không lộ toàn bộ bản đồ API cho người lạ.
#   cors_origins: danh sách domain được phép gọi API từ trình duyệt. "*" = mọi nơi
#                 (tiện lúc dev). Khi ra mắt hãy đổi thành domain thật, ví dụ:
#                 cors_origins = ["https://vyling.vn"]
[security]
expose_docs  = true
cors_origins = ["*"]

# Hạn mức gọi AI mỗi ngày, tính bằng "điểm" (reset lúc nửa đêm theo giờ máy chủ).
# Giá mỗi lượt: hỏi gia sư 2 · chấm bài viết TOPIK 5 · luyện nói 2 · chấm phát âm 2 · tra từ sâu 1.
# Khách chưa đăng nhập tính theo IP; đã đăng nhập tính theo tài khoản.
[quota]
guest_per_day    = 20
user_per_day     = 80
plus_per_day     = 250
burst_per_minute = 12

# Đo lường lượt truy cập & xác minh quyền sở hữu website.
#   ga4_id: mã đo lường Google Analytics 4, dạng "G-XXXXXXXXXX" (lấy ở Admin →
#           Luồng dữ liệu trong analytics.google.com). ĐỂ TRỐNG thì web KHÔNG nạp
#           script ngoài nào và không đặt cookie theo dõi — mặc định là tắt.
#   google_site_verification: dùng để xác minh website trong Google Search Console.
#           Chọn cách "Tệp HTML", Google cho tải file tên google<mã>.html —
#           chỉ cần điền phần <mã> vào đây, hệ thống tự phục vụ file đó.
[analytics]
ga4_id                   = ""
google_site_verification = ""

# Gửi email hệ thống (mã đổi/quên mật khẩu). Để TRỐNG host thì hệ thống KHÔNG gửi
# email thật mà IN MÃ ra console (tiện thử ở máy nhà). Khi muốn gửi thật:
#   Gmail: host="smtp.gmail.com", port=587, user="<email>@gmail.com",
#          password="<Mật khẩu ứng dụng 16 ký tự>" (tạo tại https://myaccount.google.com/apppasswords,
#          cần bật xác minh 2 bước — KHÔNG dùng mật khẩu Gmail thường).
#   sender để trống thì lấy theo user; sender_name là tên hiển thị.
[smtp]
host        = ""
port        = 587
user        = ""
password    = ""
sender      = ""
sender_name = "VyLing"

# Thư gửi chủ động (khác với thư theo yêu cầu như mã đổi mật khẩu).
#   daily_reminder: bật/tắt thư nhắc học hằng ngày cho người hôm nay chưa học.
#                   Chỉ gửi cho người ĐÃ xác minh email và chưa bấm huỷ nhận;
#                   mỗi người tối đa 1 thư/ngày; thư nào cũng có link huỷ nhận.
#   reminder_hour : giờ gửi (0–23) theo giờ máy chủ. 20 = 8 giờ tối.
# Cần khai [app] public_url thì link trong thư mới trỏ đúng tên miền thật.
[email]
daily_reminder = true
reminder_hour  = 20

# Tài khoản quản trị (đăng nhập trang Admin để quản lý nội dung & người dùng).
# Để password TRỐNG: lần khởi động đầu hệ thống tự sinh mật khẩu ngẫu nhiên
# và in ra console đúng 1 lần — hãy lưu lại rồi đổi trong trang Admin.
[admin]
email    = "admin@vyling.vn"
password = ""
name     = "Quản trị viên"

# Gọi thoại trực tiếp trong phòng luyện nói (WebRTC).
#   stun_* : miễn phí, đủ cho phần lớn máy ở nhà/văn phòng — không cần cài gì.
#   turn_* : máy chủ chuyển tiếp, CẦN khi hai người đều ở sau NAT chặt (4G, wifi công ty).
#            Tự dựng bằng coturn trên VPS rồi điền vào đây, hoặc mua dịch vụ TURN.
#            Để trống cũng chạy, chỉ là một số cuộc gọi sẽ không kết nối được.
#   Lưu ý: trình duyệt chỉ cho dùng micro trên HTTPS (hoặc localhost).
[webrtc]
stun_urls     = ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"]
turn_url      = ""
turn_user     = ""
turn_password = ""

# Đăng nhập Google / Facebook (tùy chọn). Để trống thì 2 nút đó sẽ ẩn.
#   Google : tạo OAuth Client ID (Web) tại https://console.cloud.google.com/apis/credentials
#            thêm Authorized redirect URI: http://127.0.0.1:8000/api/auth/google/callback
#   Facebook: tạo app tại https://developers.facebook.com → Facebook Login
#            Valid OAuth Redirect URI: http://127.0.0.1:8000/api/auth/facebook/callback
[oauth]
google_client_id     = ""
google_client_secret = ""
facebook_app_id      = ""
facebook_app_secret  = ""
